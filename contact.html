<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Aaron</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6fa;
max-width:800px;
margin:auto;
padding:40px;
}

h1{
color:#081633;
margin-bottom:20px;
}

input, textarea{
width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
background:#2340c0;
color:white;
padding:15px 30px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:.9;
}
</style>
</head>
<body>

<h1>Contact Aaron</h1>

<p>
Need help with AI tools, ChatGPT, websites, content creation, or online business ideas? Send a message below.
</p>

<form action="https://formsubmit.co/imipalletfactoryus@icloud.com" method="POST">

<input type="hidden" name="_subject" value="New Website Contact Form Submission">

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<textarea name="message" rows="6" placeholder="Tell me about your project..." required></textarea>

<button type="submit">Send Message</button>

</form>

</body>
</html>
